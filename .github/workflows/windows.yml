name: Windows

on: 
  push:

jobs:

  build-windows:

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-2019]
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: setup
        env: 
          repo: open-ephys-gui
          package: "open-ephys-lib"
        run: |
          cd ../..
          git clone https://github.com/open-ephys/plugin-GUI.git --branch development-juce8
          cd plugin-GUI/Build
          cmake -G "Visual Studio 16 2019" -A x64 .. 
          mkdir Release && cd Release
          curl -L https://openephysgui.jfrog.io/artifactory/Libraries/open-ephys-lib-v0.7.0.zip --output open-ephys-lib.zip 
          unzip open-ephys-lib.zip
        shell: bash
      - name: configure
        run: |
          cd Build
          cmake -G "Visual Studio 16 2019" -A x64 .. 
        shell: bash
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2
      - name: build
        run: |
          msbuild Build/INSTALL.vcxproj -p:Configuration=Release -p:Platform=x64
        shell: cmd
      - name: deploy
        if: github.ref == 'refs/heads/juce8'
        env:
          artifactoryApiKey: ${{ secrets.artifactoryApiKey }}
          build_dir: "Build/Release"
          package: OpenEphysDataFormat-windows
        run: |
          plugin_api=$(grep -rnw ../../plugin-GUI/Source -e '#define PLUGIN_API_VER' | grep -Eo "[0-9]*" | tail -1)
          tag=$(grep -w Source/OpenEphysLib.cpp -e 'info->libVersion' | grep -Eo "[0-9]+.[0-9]+.[0-9]+")
          new_plugin_ver=$tag-API$plugin_api
          mkdir plugins
          cp -v $build_dir/*.dll plugins
          zipfile=${package}_${new_plugin_ver}.zip
          powershell Compress-Archive -Path "plugins" -DestinationPath ${zipfile}
          curl -H "X-JFrog-Art-Api:$artifactoryApiKey" -T $zipfile "https://openephys.jfrog.io/artifactory/OpenEphysDataFormat-plugin/windows/$zipfile"
        shell: bash